name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/pharmalink
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            sleep 5
            curl -sf -o /dev/null -w "frontend:%{http_code}\n" -H "Host: pharmalink.prambanandigital.com" http://127.0.0.1/
            curl -sf -o /dev/null -w "api:%{http_code}\n" -H "Host: pharmalink.prambanandigital.com" http://127.0.0.1/api/user || true
